<style>
  :root {
    --bg: #f5f2ee;
    --surface: #ffffff;
    --surface2: #f0ece6;
    --border: #e0d9d0;
    --charcoal: #303636;
    --salmon: #D4967D;
    --salmon-light: #e8b89f;
    --text: #303636;
    --muted: #7a8080;
    --green: #4a8c6f;
    --red: #b55a42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PT Serif', Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--charcoal); padding: 20px 40px; display:flex; align-items:center; justify-content:space-between; z-index:100; }
  .logo { display:flex; flex-direction:column; gap:2px; }
  .logo-text h1 { font-family:'Marcellus', serif; font-size:20px; font-weight:400; color:white; letter-spacing:0.08em; text-transform:uppercase; }
  .header-logo { height:58px; width:auto; display:block; }
  .logo-text p { font-size:11px; color:rgba(255,255,255,0.55); letter-spacing:0.12em; text-transform:uppercase; font-family:'PT Serif', serif; }
  .logo-icon { display:none; }
  .header-cta { background: var(--salmon); color:white; border:none; padding:10px 26px; border-radius:30px; font-size:13px; font-family:'PT Serif', serif; letter-spacing:0.05em; cursor:pointer; transition:background .2s; }
  .header-cta:hover { background: var(--salmon-light); }
  .admin-nav { display:flex; align-items:center; gap:16px; }
  .admin-link { color:rgba(255,255,255,0.6); font-size:12px; letter-spacing:0.06em; text-decoration:none; text-transform:uppercase; border:1px solid rgba(255,255,255,0.2); padding:6px 14px; border-radius:20px; transition:all .2s; }
  .admin-link:hover { color:white; border-color:rgba(255,255,255,0.5); }

  .controls { max-width:1400px; margin:0 auto; padding:28px 40px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .search-wrap { position:relative; flex:1; min-width:200px; }
  .search-wrap input { width:100%; background:white; border:1px solid var(--border); color:var(--text); padding:10px 14px 10px 38px; border-radius:4px; font-size:14px; font-family:'PT Serif', serif; outline:none; }
  .search-wrap input:focus { border-color:var(--salmon); }
  .search-wrap input::placeholder { color:var(--muted); }
  .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .filter-chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:8px 20px; border-radius:30px; border:1px solid var(--border); background:white; color:var(--muted); font-size:13px; font-family:'PT Serif', serif; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .chip:hover { border-color:var(--salmon); color:var(--charcoal); }
  .chip.active { background:var(--salmon); border-color:var(--salmon); color:white; }
  .sort-select { background:white; border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:4px; font-size:13px; font-family:'PT Serif', serif; cursor:pointer; outline:none; }
  .sort-select:focus { border-color:var(--salmon); }
  .count-badge { padding:7px 14px; background:var(--charcoal); border-radius:30px; font-size:13px; color:white; white-space:nowrap; font-family:'PT Serif', serif; letter-spacing:0.04em; }

  .grid { max-width:1400px; margin:0 auto; padding:0 40px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:24px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:4px; overflow:hidden; transition:transform .25s, box-shadow .25s; }
  .card:hover { transform:translateY(-4px); box-shadow:0 16px 48px rgba(48,54,54,.12); }

  .card-photo { position:relative; height:200px; background:var(--surface2); overflow:hidden; }
  .card-photo img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s; }
  .card:hover .card-photo img { transform:scale(1.05); }
  .card-photo .photo-fallback {
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:rgba(255,255,255,.85); font-size:13px; gap:6px; padding:16px; text-align:center;
    position:relative; overflow:hidden;
  }
  .card-photo .photo-fallback::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at 30% 30%,rgba(255,255,255,.06) 0%,transparent 70%);
  }
  .card-photo .photo-fallback .house-icon { font-size:38px; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3)); position:relative; z-index:1; }
  .card-photo .photo-fallback .fb-addr { font-size:12px; font-weight:600; color:rgba(255,255,255,.9); position:relative; z-index:1; max-width:200px; line-height:1.4; }
  .card-photo .photo-fallback .fb-city { font-size:11px; color:rgba(255,255,255,.6); position:relative; z-index:1; }
  .card-photo.flip-card .photo-fallback { background:linear-gradient(135deg,#4a3820,#7a5c38,#2e2010); }
  .card-photo.rental-card .photo-fallback { background:linear-gradient(135deg,#2a3d38,#4a6e60,#1a2820); }
  .card-photo.coliving-card .photo-fallback { background:linear-gradient(135deg,#4a3020,#8a6040,#2e1e10); }
  .card-photo.pending-card .photo-fallback { background:linear-gradient(135deg,#303636,#4a5454,#1e2424); }
  .change-photo-btn { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.55); color:white; border:none; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; opacity:0; transition:opacity .2s; backdrop-filter:blur(4px); text-decoration:none; z-index:10; }
  .card:hover .change-photo-btn { opacity:1; }
  .change-photo-btn:hover { background:rgba(212,150,125,.9) !important; }
  .photo-links { position:absolute; bottom:8px; right:8px; display:flex; gap:5px; }
  .photo-link { padding:4px 10px; border-radius:4px; font-size:11px; font-weight:600; text-decoration:none; cursor:pointer; transition:opacity .2s; backdrop-filter:blur(6px); font-family:'PT Serif', serif; }
  .photo-link:hover { opacity:.85; }
  .photo-link.zillow { background:rgba(0,86,214,.85); color:white; }
  .photo-link.redfin { background:rgba(196,40,0,.85); color:white; }
  .photo-link.realtor { background:rgba(180,0,0,.85); color:white; }
  .strategy-badge-photo { position:absolute; top:10px; left:10px; padding:4px 12px; border-radius:3px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; font-family:'PT Serif', serif; backdrop-filter:blur(6px); }
  .strategy-badge-photo.flip { background:rgba(212,150,125,.9); color:white; }
  .strategy-badge-photo.rental { background:rgba(74,140,111,.9); color:white; }
  .strategy-badge-photo.pending { background:rgba(48,54,54,.8); color:rgba(212,150,125,1); }

  .card-body { padding:18px 20px; }
  .card-address { font-family:'PT Serif', serif; font-size:15px; font-weight:400; margin-bottom:1px; color:var(--charcoal); }
  .card-city { font-size:14px; color:var(--charcoal); margin-bottom:14px; letter-spacing:0.01em; }
  .price-row { display:flex; align-items:baseline; gap:8px; margin-bottom:14px; }
  .asking-price { font-family:'Marcellus', serif; font-size:26px; font-weight:400; color:var(--charcoal); }
  .price-label { font-size:12px; color:var(--muted); }

  .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
  .metric { border-top:2px solid var(--border); padding-top:8px; }
  .metric .m-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:3px; }
  .metric .m-value { font-size:14px; font-weight:700; color:var(--charcoal); }
  .metric .m-value.na { color:var(--muted); font-style:italic; font-weight:400; font-size:12px; }

  .prop-row { display:flex; align-items:center; gap:10px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .prop-pill { background:var(--surface2); padding:2px 8px; border-radius:3px; font-size:11px; letter-spacing:0.03em; }

  .card-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface2); flex-wrap:wrap; }
  .date-badge { font-size:11px; color:var(--muted); letter-spacing:0.04em; }
  .footer-btns { display:flex; gap:8px; align-items:center; }
  .source-chip { font-size:11px; color:var(--muted); background:white; border:1px solid var(--border); border-radius:20px; padding:2px 10px; letter-spacing:0.03em; white-space:nowrap; }
  .source-chip::before { content:'via '; opacity:.7; }
  .owner-notes { padding:10px 20px 14px; border-top:1px solid var(--border); background:#fdfcfb; }
  .notes-label { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:5px; }
  .notes-textarea { width:100%; font-family:'PT Serif', Georgia, serif; font-size:13px; color:var(--charcoal); border:1px solid transparent; border-radius:4px; padding:6px 8px; background:transparent; resize:none; min-height:34px; line-height:1.5; transition:border-color .15s, background .15s; outline:none; }
  .notes-textarea:hover { border-color:var(--border); background:white; }
  .notes-textarea:focus { border-color:var(--salmon-light); background:white; }
  .notes-textarea::placeholder { color:#bbb; font-style:italic; }
  .interest-btn { background:var(--salmon); color:white; border:none; padding:8px 18px; border-radius:30px; font-size:12px; font-family:'PT Serif', serif; letter-spacing:0.04em; cursor:pointer; transition:background .2s; }
  .interest-btn:hover { background:var(--salmon-light); }
  .photos-btn { background:white; color:var(--charcoal); border:1px solid var(--border); padding:8px 14px; border-radius:30px; font-size:12px; font-family:'PT Serif', serif; letter-spacing:0.04em; cursor:pointer; text-decoration:none; transition:border-color .2s; display:inline-block; }
  .photos-btn:hover { border-color:var(--salmon); color:var(--salmon); }

  .no-results { grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--muted); }
  .no-results .icon { font-size:48px; margin-bottom:16px; }
  .no-results h3 { font-family:'Marcellus', serif; font-size:22px; font-weight:400; margin-bottom:8px; color:var(--charcoal); }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(48,54,54,.6); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:white; border:1px solid var(--border); border-radius:4px; padding:34px; width:100%; max-width:480px; position:relative; animation:slideUp .25s ease; max-height:90vh; overflow-y:auto; }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .modal h2 { font-family:'Marcellus', serif; font-size:22px; font-weight:400; margin-bottom:4px; color:var(--charcoal); }
  .modal-address { font-size:13px; color:var(--muted); margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .modal-close { position:absolute; top:18px; right:18px; background:var(--surface2); border:1px solid var(--border); color:var(--muted); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .modal-links { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .modal-link { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:4px; text-decoration:none; font-size:13px; font-family:'PT Serif', serif; transition:opacity .2s; }
  .modal-link:hover { opacity:.85; }
  .modal-link.zillow { background:#0056d6; color:white; }
  .modal-link.redfin { background:#c42800; color:white; }
  .modal-link.realtor { background:#d00000; color:white; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:11px; font-weight:400; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.08em; }
  .form-group input, .form-group textarea { width:100%; background:white; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:4px; font-size:14px; outline:none; font-family:'PT Serif', serif; }
  .form-group input:focus, .form-group textarea:focus { border-color:var(--salmon); }
  .form-group textarea { min-height:70px; resize:vertical; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .submit-btn { width:100%; background:var(--salmon); color:white; border:none; padding:13px; border-radius:30px; font-size:14px; font-family:'PT Serif', serif; letter-spacing:0.06em; cursor:pointer; margin-top:6px; transition:background .2s; }
  .submit-btn:hover { background:var(--salmon-light); }
  .success-msg { text-align:center; padding:16px 0; }
  .success-msg .checkmark { font-size:44px; margin-bottom:10px; }
  .success-msg h3 { font-family:'Marcellus', serif; font-size:20px; font-weight:400; margin-bottom:6px; color:var(--charcoal); }
  .success-msg p { color:var(--muted); font-size:13px; }

  @media(max-width:768px){
    header{padding:16px 20px;}
    .controls,.grid{padding-left:20px;padding-right:20px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-text">
      <img src="logo.png" alt="Megan Colyer Corp" class="header-logo">
      <p>Off-Market Investment Deals</p>
    </div>
  </div>
  <div class="admin-nav">
    <a class="admin-link" href="admin/">Admin</a>
    <button class="header-cta" onclick="openModal(null)">Express Interest</button>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search address, city, state..." oninput="render()">
  </div>
  <div class="filter-chips">
    <div class="chip active" onclick="setFilter('all',this)">All</div>
    <div class="chip" onclick="setFilter('sfh',this)">Single Family</div>
    <div class="chip" onclick="setFilter('mfh',this)">Multi Family</div>
  </div>
  <select class="sort-select" id="zipSelect" onchange="render()">
    <option value="">All Zip Codes</option>
  </select>
  <select class="sort-select" id="sortSelect" onchange="render()">
    <option value="newest">Newest First</option>
    <option value="zip">Zip Code</option>
    <option value="price_asc">Price: Low to High</option>
    <option value="price_desc">Price: High to Low</option>
    <option value="arv">Best ARV</option>
    <option value="spread">Best Spread</option>
  </select>
  <div class="count-badge" id="countBadge">— deals</div>
</div>

<div class="grid" id="dealGrid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>Express Interest</h2>
    <div class="modal-address" id="modalAddress">Let us know you're interested and we'll be in touch.</div>
    <div id="modalLinks" class="modal-links"></div>
    <div id="modalForm">
      <div class="form-row">
        <div class="form-group"><label>First Name *</label><input type="text" id="fname" placeholder="Jane"></div>
        <div class="form-group"><label>Last Name *</label><input type="text" id="lname" placeholder="Smith"></div>
      </div>
      <div class="form-group"><label>Email *</label><input type="email" id="email" placeholder="jane@example.com"></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="phone" placeholder="(314) 555-0100"></div>
      <div class="form-group"><label>Notes / Questions</label><textarea id="notes" placeholder="Tell us what you're looking for..."></textarea></div>
      <button class="submit-btn" onclick="submitForm()">Submit Interest →</button>
    </div>
    <div id="modalSuccess" class="success-msg" style="display:none">
      <div class="checkmark">✅</div><h3>Got it!</h3>
      <p>We'll reach out within 24 hours to discuss this deal.</p>
    </div>
  </div>
</div>

<script>
// Owner-only: notes stored in localStorage, keyed by deal address
const ownerNotes = JSON.parse(localStorage.getItem('ownerNotes') || '{}');
function saveNote(ta) {
  const addr = ta.dataset.address;
  if (ta.value.trim()) ownerNotes[addr] = ta.value;
  else delete ownerNotes[addr];
  localStorage.setItem('ownerNotes', JSON.stringify(ownerNotes));
}
function autoResizeNotes(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.max(34, ta.scrollHeight) + 'px';
}
function initNoteHeights() {
  document.querySelectorAll('.notes-textarea').forEach(ta => { if (ta.value) autoResizeNotes(ta); });
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxATueK1LD5LFGL_KNCBXF6ijTeFyE5qcYsSFdcPucbsNQSD8SeDnBGT3O8ZBafqy2F7Q/exec';
let DEALS = [];

let activeFilter = 'all';

function populateZips() {
  const zips = [...new Set(DEALS.map(d => {
    const m = d.address.match(/\b(\d{5})\b/);
    return m ? m[1] : null;
  }).filter(Boolean))].sort();
  const sel = document.getElementById('zipSelect');
  sel.innerHTML = '<option value="">All Zip Codes</option>';
  zips.forEach(z => {
    const opt = document.createElement('option');
    opt.value = z; opt.textContent = z;
    sel.appendChild(opt);
  });
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const sort = document.getElementById('sortSelect').value;
  const zip = document.getElementById('zipSelect').value;
  let list = DEALS.filter(d => {
    if (d.status === 'archived') return false;
    if (q && !d.address.toLowerCase().includes(q) && !(d.city||'').toLowerCase().includes(q) && !(d.state||'').toLowerCase().includes(q)) return false;
    if (activeFilter === 'sfh') { if (!/single.?family/i.test(d.propertyType||'')) return false; }
    if (activeFilter === 'mfh') { if (!/multi.?family/i.test(d.propertyType||'')) return false; }
    if (zip) { const m = d.address.match(/\b(\d{5})\b/); if (!m || m[1] !== zip) return false; }
    return true;
  });
  if (sort === 'newest' || !sort) list.sort((a,b) => new Date(b.date) - new Date(a.date));
  else if (sort === 'zip') list.sort((a,b) => { const za=(a.address.match(/\b(\d{5})\b/)||['',''])[1]; const zb=(b.address.match(/\b(\d{5})\b/)||['',''])[1]; return za.localeCompare(zb); });
  else if (sort === 'price_asc') list.sort((a,b) => (a.askingPrice||Infinity)-(b.askingPrice||Infinity));
  else if (sort === 'price_desc') list.sort((a,b) => (b.askingPrice||0)-(a.askingPrice||0));
  else if (sort === 'arv') list.sort((a,b) => (b.arv||0)-(a.arv||0));
  else if (sort === 'spread') list.sort((a,b) => (b.spread||0)-(a.spread||0));
  return list;
}

function fmt(n) { return n!=null ? '$'+Math.round(n).toLocaleString() : '—'; }

function render() {
  const deals = getFiltered();
  document.getElementById('countBadge').textContent = deals.length + ' deal' + (deals.length!==1?'s':'');
  const grid = document.getElementById('dealGrid');
  if (!deals.length) {
    grid.innerHTML = '<div class="no-results"><div class="icon">🔍</div><h3>No deals match</h3><p>Try adjusting your filters or search.</p></div>';
    return;
  }
  grid.innerHTML = deals.map((d, i) => {

    const parts=[d.beds?d.beds+' bd':'',d.baths?d.baths+' ba':'',d.sqft?d.sqft.toLocaleString()+' sqft':''].filter(Boolean);
    const statusDot = d.status==='new'?'🟢':d.status==='sent'?'🔵':'👁';
    const addr0 = d.address.split(',')[0];
    const propIcon = d.propertyType && d.propertyType.toLowerCase().includes('multi') ? '🏘️'
      : d.propertyType && d.propertyType.toLowerCase().includes('condo') ? '🏢'
      : '🏠';
    const photoClass = d.strategy==='flip'?'flip-card':d.strategy==='coLiving'?'coliving-card':d.strategy==='longTermRental'?'rental-card':'pending-card';
    const addr0short = d.address.split(',')[0];
    const zip = d.zip || (d.address.match(/(\d{5})(?:-\d{4})?\s*$/) || [])[1] || '';
    const photoHtml = d.photo ? `
      <img src="${d.photo}" alt="${addr0short}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="photo-fallback" style="display:none">
        <div class="house-icon">${propIcon}</div>
        <div class="fb-addr">${addr0short}</div>
        <div class="fb-city">${d.city||''}, ${d.state||''}</div>
      </div>` : `
      <div class="photo-fallback">
        <div class="house-icon">${propIcon}</div>
        <div class="fb-addr">No Photos Available</div>
        <div class="fb-city">${d.city||''}, ${d.state||''}</div>
      </div>`;
    const adminLink = `admin/#${encodeURIComponent(d.address)}`;
    return `<div class="card" onclick="openModal(${i})">
      <div class="card-photo ${photoClass}">${photoHtml}<a class="change-photo-btn" href="${adminLink}" onclick="event.stopPropagation()" title="Change cover photo">📷</a></div>
      <div class="card-body">
        <div class="card-address">${addr0}</div>
        <div class="card-city">${d.city}, ${d.state}${zip ? ' ' + zip : ''} ${statusDot}</div>
        <div class="price-row">
          <div class="asking-price">${fmt(d.askingPrice)}</div>
          <div class="price-label">asking</div>
        </div>
        <div class="metrics">
          <div class="metric"><div class="m-label">ARV</div><div class="m-value ${!d.arv?'na':''}">${d.arv?fmt(d.arv):'Pending'}</div></div>
          <div class="metric"><div class="m-label">Repairs</div><div class="m-value ${!d.repairCost?'na':''}">${d.repairCost?fmt(d.repairCost):'Pending'}</div></div>
        </div>
        <div class="prop-row">
          <span>${parts.join(' · ')||'Details TBD'}</span>
          <span class="prop-pill">${d.propertyType||'Single Family'}</span>
          ${d.yearBuilt?`<span>Built ${d.yearBuilt}</span>`:''}
        </div>
      </div>
      <div class="card-footer">
        <span class="date-badge">Added ${d.date ? new Date(d.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''}</span>
        <div class="footer-btns">
          ${d.source ? `<span class="source-chip">${d.source}</span>` : ''}
          ${d.driveUrl ? `<a class="photos-btn" href="${d.driveUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📷 View More Photos</a>` : ''}
          <button class="interest-btn" onclick="event.stopPropagation();openModal(${i})">I'm Interested →</button>
        </div>
      </div>
      <div class="owner-notes" onclick="event.stopPropagation()">
        <div class="notes-label">My Notes</div>
        <textarea class="notes-textarea" rows="2" placeholder="Add a private note about this deal…" data-address="${d.address}"
          oninput="autoResizeNotes(this)"
          onfocus="autoResizeNotes(this)"
          onblur="saveNote(this)">${ownerNotes[d.address]||''}</textarea>
      </div>
    </div>`;
  }).join('');
  initNoteHeights();
}

function openModal(idx) {
  const deals = getFiltered();
  const d = idx !== null ? deals[idx] : null;
  document.getElementById('modalAddress').textContent = d ? '📍 '+d.address : "Let us know you're interested and we'll be in touch.";
  document.getElementById('modalLinks').style.display = 'none';
  document.getElementById('modalForm').style.display = 'block';
  document.getElementById('modalSuccess').style.display = 'none';
  ['fname','lname','email','phone','notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target===document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('open');
}

function submitForm() {
  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const email = document.getElementById('email').value.trim();
  const phoneEl = document.getElementById('phone');
  const notesEl = document.getElementById('notes');
  const phone = phoneEl ? phoneEl.value.trim() : '';
  const notes = notesEl ? notesEl.value.trim() : '';
  if (!fname||!lname||!email) { alert('Please fill in your name and email.'); return; }

  // Get the property this person is interested in
  const addrEl = document.getElementById('modalAddress');
  const property = addrEl ? addrEl.textContent.replace('📍 ','').trim() : '';

  document.getElementById('modalForm').style.display = 'none';
  document.getElementById('modalSuccess').style.display = 'block';

  // POST to our own backend so submissions are logged and emailed reliably
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'addInterest',
      interest: {
        name: fname + ' ' + lname,
        email: email,
        phone: phone || '',
        property: property || '',
        notes: notes || ''
      }
    })
  }).catch(() => {});
}

document.addEventListener('keydown', e => { if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('open'); });

// Load deals dynamically from Google Sheet
(function initPortal() {
  document.getElementById('dealGrid').innerHTML = '<div class="no-results"><div class="icon">⏳</div><h3>Loading deals…</h3><p>Fetching the latest properties.</p></div>';
  document.getElementById('countBadge').textContent = 'Loading…';
  fetch(GAS_URL + '?action=getDeals')
    .then(r => r.json())
    .then(data => {
      DEALS = Array.isArray(data) ? data : (data.deals || []);
      populateZips();
      render();
      initNoteHeights();
    })
    .catch(err => {
      console.error('Failed to load deals:', err);
      document.getElementById('dealGrid').innerHTML = '<div class="no-results"><div class="icon">⚠️</div><h3>Couldn\'t load deals</h3><p>Please refresh the page to try again.</p></div>';
      document.getElementById('countBadge').textContent = '0 deals';
    });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
