<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megan's Deal Portal Links</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 28px;
  }
  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #0f172a;
    margin-bottom: 10px;
    text-decoration: none;
    color: #e2e8f0;
    transition: background 0.15s, transform 0.1s;
    border: 1px solid #1e293b;
  }
  .link-row:hover {
    background: #1a2740;
    transform: translateY(-1px);
    border-color: #334155;
  }
  .icon {
    font-size: 20px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .icon-buyer { background: #0ea5e91a; }
  .icon-owner { background: #8b5cf61a; }
  .icon-admin { background: #f59e0b1a; }
  .link-text { flex: 1; }
  .link-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .link-desc {
    font-size: 12px;
    color: #64748b;
  }
  .arrow {
    color: #334155;
    font-size: 16px;
  }
  .divider {
    border: none;
    border-top: 1px solid #1e3a5f22;
    margin: 20px 0 16px;
  }
  .label {
    font-size: 11px;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏠 Deal Portals</div>
  <div class="subtitle">Megan Colyer — Quick Access Links</div>

  <div class="label">Public</div>
  <a class="link-row" href="https://megan-colyer-deals.surge.sh/index.html" target="_blank" rel="noopener">
    <div class="icon icon-buyer">🏡</div>
    <div class="link-text">
      <div class="link-name">Buyer Portal</div>
      <div class="link-desc">Share with buyers to browse deals</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <hr class="divider">
  <div class="label">Private</div>

  <a class="link-row" href="https://megan-colyer-deals.surge.sh/owner.html" target="_blank" rel="noopener">
    <div class="icon icon-owner">👤</div>
    <div class="link-text">
      <div class="link-name">Owner View</div>
      <div class="link-desc">Your personal dashboard + admin link</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="link-row" href="https://megan-colyer-deals.surge.sh/admin.html" target="_blank" rel="noopener">
    <div class="icon icon-admin">⚙️</div>
    <div class="link-text">
      <div class="link-name">Admin Panel</div>
      <div class="link-desc">Add, edit & manage all deals</div>
    </div>
    <div class="arrow">›</div>
  </a>
</div>
</body>
</html>
