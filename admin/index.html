<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Megan Colyer Corp</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ee;
    --surface: #ffffff;
    --surface2: #f0ece6;
    --border: #e0d9d0;
    --charcoal: #303636;
    --salmon: #D4967D;
    --salmon-light: #e8b89f;
    --text: #303636;
    --muted: #7a8080;
    --green: #4a8c6f;
    --red: #b55a42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PT Serif', Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--charcoal); padding: 18px 40px; display:flex; align-items:center; justify-content:space-between; z-index:200; }
  .logo-text h1 { font-family:'Marcellus', serif; font-size:18px; font-weight:400; color:white; letter-spacing:0.08em; text-transform:uppercase; }
  .logo-text p { font-size:11px; color:rgba(255,255,255,0.5); letter-spacing:0.12em; text-transform:uppercase; }
  .header-logo-sm { height:34px; width:auto; display:block; margin-top:4px; }
  .header-right { display:flex; gap:12px; align-items:center; }
  .back-btn { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; letter-spacing:0.04em; }
  .back-btn:hover { color:white; }
  .apply-all-btn { background: var(--salmon); color:white; border:none; padding:9px 22px; border-radius:30px; font-size:13px; font-family:'PT Serif', serif; cursor:pointer; transition:background .2s; display:none; }
  .apply-all-btn:hover { background: var(--salmon-light); }
  .apply-all-btn.visible { display:block; }

  .pending-bar { background: #fff8f4; border-bottom: 1px solid #f0d5c4; padding: 12px 40px; display:none; align-items:center; gap:16px; }
  .pending-bar.visible { display:flex; }
  .pending-badge { background: var(--salmon); color:white; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:bold; }
  .pending-info { color: var(--text); font-size:13px; }
  .copy-btn { margin-left:auto; background: var(--charcoal); color:white; border:none; padding:8px 20px; border-radius:4px; font-size:12px; cursor:pointer; letter-spacing:0.05em; }
  .copy-btn:hover { background: #404848; }

  .page { max-width:1200px; margin:0 auto; padding:36px 40px 80px; }
  .page-title { font-family:'Marcellus', serif; font-size:24px; font-weight:400; margin-bottom:6px; letter-spacing:0.04em; }
  .page-sub { color: var(--muted); font-size:14px; margin-bottom:36px; }

  .section-label { font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color: var(--muted); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border); }

  .deal-card { background: var(--surface); border:1px solid var(--border); border-radius:6px; margin-bottom:24px; overflow:hidden; }
  .deal-header { padding:20px 24px; display:flex; align-items:center; gap:20px; cursor:pointer; user-select:none; }
  .deal-header:hover { background: #faf8f6; }
  .deal-cover-thumb { width:72px; height:54px; object-fit:cover; border-radius:4px; border:1px solid var(--border); background:#eee; flex-shrink:0; }
  .deal-cover-thumb.no-photo { display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--muted); background: var(--surface2); }
  .deal-info { flex:1; }
  .deal-address { font-size:15px; font-weight:700; margin-bottom:2px; }
  .deal-meta { font-size:12px; color:var(--muted); }
  .pending-tag { display:inline-block; background:#fff0e8; color: var(--salmon); border:1px solid #f0c8a8; border-radius:12px; font-size:11px; padding:2px 10px; margin-left:8px; }
  .expand-icon { color:var(--muted); font-size:18px; transition:transform .2s; flex-shrink:0; }
  .deal-card.open .expand-icon { transform: rotate(180deg); }

  .photo-panel { display:none; border-top:1px solid var(--border); padding:20px 24px; background: #faf8f6; }
  .deal-card.open .photo-panel { display:block; }

  .photo-panel-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .photo-count { font-size:13px; color:var(--muted); }
  .folder-link { font-size:12px; color: var(--salmon); text-decoration:none; }
  .folder-link:hover { text-decoration:underline; }

  .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .photo-thumb { position:relative; cursor:pointer; border-radius:4px; overflow:hidden; border:3px solid transparent; transition:border-color .15s, transform .15s; }
  .photo-thumb:hover { transform:scale(1.03); border-color: var(--salmon-light); }
  .photo-thumb.current { border-color: var(--green); }
  .photo-thumb.selected { border-color: var(--salmon); }
  .photo-thumb img { width:100%; height:120px; object-fit:cover; display:block; background:#eee; }
  .photo-thumb img[src=""] { display:none; }
  .thumb-label { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.7)); padding:6px 8px 4px; font-size:10px; color:white; }
  .badge { position:absolute; top:5px; right:5px; border-radius:20px; font-size:10px; padding:2px 8px; font-weight:bold; }
  .badge-current { background: var(--green); color:white; }
  .badge-selected { background: var(--salmon); color:white; }

  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:999; align-items:center; justify-content:center; }
  .lightbox.open { display:flex; }
  .lightbox-inner { position:relative; max-width:90vw; max-height:90vh; }
  .lightbox-inner img { max-width:100%; max-height:85vh; object-fit:contain; border-radius:4px; }
  .lightbox-close { position:absolute; top:-16px; right:-16px; background:white; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
  .lightbox-set-btn { display:block; margin:16px auto 0; background: var(--salmon); color:white; border:none; padding:10px 28px; border-radius:30px; font-size:14px; cursor:pointer; font-family:'PT Serif', serif; }
  .lightbox-set-btn:hover { background: var(--salmon-light); }
  .lightbox-name { text-align:center; color:white; font-size:13px; margin-top:10px; opacity:.7; }

  .no-photos-deal { background: var(--surface); border:1px solid var(--border); border-radius:6px; padding:16px 24px; margin-bottom:12px; display:flex; align-items:center; gap:16px; }
  .no-photos-deal .deal-address { font-size:14px; }
  .no-photos-deal .deal-meta { font-size:12px; color:var(--muted); }

  .copy-area { margin-top:20px; background: var(--charcoal); border-radius:6px; padding:20px; }
  .copy-area h3 { font-family:'Marcellus', serif; font-size:15px; color:white; margin-bottom:10px; font-weight:400; }
  .copy-area textarea { width:100%; height:120px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; border-radius:4px; padding:12px; font-size:12px; font-family:monospace; resize:none; }
  .copy-area-btns { display:flex; gap:10px; margin-top:10px; }
  .copy-text-btn { background: var(--salmon); color:white; border:none; padding:9px 22px; border-radius:4px; font-size:13px; cursor:pointer; }
  .copy-text-btn:hover { background: var(--salmon-light); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--charcoal); color:white; padding:12px 24px; border-radius:30px; font-size:13px; opacity:0; transition:opacity .3s; z-index:9999; pointer-events:none; }
  .toast.show { opacity:1; }

  .add-folder-section { margin-top:24px; border-top:1px solid var(--border); padding-top:20px; }
  .add-folder-section h3 { font-family:'Marcellus',serif; font-size:16px; font-weight:400; margin-bottom:6px; }
  .add-folder-section p { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .folder-input-row { display:flex; gap:8px; }
  .folder-input-row select { flex:1; padding:9px 12px; border:1px solid var(--border); border-radius:4px; font-family:'PT Serif',serif; font-size:13px; background:white; color:var(--text); }
  .folder-input-row input { flex:2; padding:9px 12px; border:1px solid var(--border); border-radius:4px; font-family:'PT Serif',serif; font-size:13px; }
  .folder-submit-btn { background:var(--charcoal); color:white; border:none; padding:9px 20px; border-radius:4px; font-size:13px; cursor:pointer; white-space:nowrap; }

  /* ── Add Deal Section ── */
  .add-deal-section { margin-top:48px; border-top:2px solid var(--border); padding-top:32px; }
  .add-deal-section .section-label { margin-bottom:24px; }
  .deal-form { background: var(--surface); border:1px solid var(--border); border-radius:8px; padding:28px 28px 24px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-group.full { grid-column:1/-1; }
  .form-group label { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
  .form-group input, .form-group select, .form-group textarea {
    padding:10px 13px; border:1px solid var(--border); border-radius:4px;
    font-family:'PT Serif',Georgia,serif; font-size:14px; color:var(--text);
    background:white; outline:none; transition:border-color .15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--salmon-light); }
  .form-group input::placeholder { color:#bbb; }
  .form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px 24px; }
  .form-row-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px 24px; }
  .form-divider { grid-column:1/-1; border:none; border-top:1px solid var(--border); margin:4px 0; }
  .form-actions { margin-top:22px; display:flex; align-items:center; gap:16px; }
  .submit-deal-btn { background: var(--salmon); color:white; border:none; padding:12px 32px; border-radius:30px; font-size:14px; font-family:'PT Serif',serif; cursor:pointer; transition:background .2s; }
  .submit-deal-btn:hover { background: var(--salmon-light); }
  .submit-deal-btn:disabled { opacity:.5; cursor:default; }
  .deal-form-status { font-size:13px; color:var(--muted); }
  .deal-form-status.success { color: var(--green); font-weight:700; }
  .deal-form-status.error { color: var(--red); }
  .price-hint { font-size:11px; color:var(--muted); margin-top:2px; }
  /* Edit Deals */
  .edit-deals-section { margin-top:48px; border-top:2px solid var(--border); padding-top:32px; }
  .edit-deals-section .section-label { margin-bottom:24px; }
  .edit-deal-list { display:flex; flex-direction:column; gap:10px; }
  .edit-deal-row { background:white; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .edit-deal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer; user-select:none; }
  .edit-deal-header:hover { background:var(--surface2); }
  .edit-deal-addr { font-family:'PT Serif',serif; font-size:14px; color:var(--charcoal); }
  .edit-deal-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .edit-deal-chevron { color:var(--muted); font-size:12px; transition:transform .2s; }
  .edit-deal-row.open .edit-deal-chevron { transform:rotate(180deg); }
  .edit-deal-body { display:none; padding:20px 18px; border-top:1px solid var(--border); background:var(--surface2); }
  .edit-deal-row.open .edit-deal-body { display:block; }
  .edit-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .edit-form-row4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
  .edit-form-row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
  .edit-form-full { margin-bottom:14px; }
  .edit-form-group label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; }
  .edit-form-group input, .edit-form-group select { width:100%; background:white; border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:4px; font-size:13px; font-family:'PT Serif',serif; outline:none; }
  .edit-form-group input:focus, .edit-form-group select:focus { border-color:var(--salmon); }
  .edit-actions { display:flex; align-items:center; gap:12px; margin-top:6px; }
  .save-deal-btn { background:var(--salmon); color:white; border:none; padding:9px 24px; border-radius:30px; font-size:13px; font-family:'PT Serif',serif; cursor:pointer; transition:background .2s; }
  .save-deal-btn:hover { background:var(--salmon-light); }
  .save-deal-btn:disabled { opacity:.5; cursor:default; }
  .delete-deal-btn { background:white; color:var(--red); border:1px solid var(--red); padding:9px 20px; border-radius:30px; font-size:13px; font-family:'PT Serif',serif; cursor:pointer; transition:all .2s; margin-left:auto; }
  .delete-deal-btn:hover { background:var(--red); color:white; }
  .delete-deal-btn:disabled { opacity:.5; cursor:default; }
  .edit-status { font-size:13px; color:var(--muted); }
  .edit-status.success { color:var(--green); font-weight:700; }
  .edit-status.error { color:var(--red); }
  /* Edit section photo grid */
  .edit-photo-section { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .edit-photo-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .edit-photo-label { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .edit-photo-hint { font-size:11px; color:var(--muted); }
  .edit-photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
  .edit-photo-thumb { position:relative; border-radius:4px; overflow:hidden; border:3px solid transparent; transition:border-color .15s; }
  .edit-photo-thumb.is-cover { border-color:var(--green); }
  .edit-photo-thumb img { width:100%; height:100px; object-fit:cover; display:block; background:#eee; }
  .edit-photo-actions { position:absolute; inset:0; background:rgba(0,0,0,0); display:flex; align-items:flex-end; justify-content:space-between; padding:4px; opacity:0; transition:opacity .15s; }
  .edit-photo-thumb:hover .edit-photo-actions { opacity:1; background:rgba(0,0,0,0.35); }
  .ephoto-cover-btn { background:var(--green); color:white; border:none; padding:3px 8px; border-radius:3px; font-size:10px; cursor:pointer; white-space:nowrap; }
  .ephoto-del-btn { background:var(--red); color:white; border:none; padding:3px 8px; border-radius:3px; font-size:10px; cursor:pointer; }
  .edit-photo-cover-badge { position:absolute; top:4px; right:4px; background:var(--green); color:white; font-size:9px; padding:2px 6px; border-radius:10px; font-weight:bold; pointer-events:none; }
</style>
</head>
<body>

<header>
  <div class="logo-text">
    <h1>Admin</h1>
    <img src="../logo.png" alt="Megan Colyer Corp" class="header-logo-sm">
  </div>
  <div class="header-right">
    <a href="../owner.html" class="back-btn">← Back to Portal</a>
  </div>
</header>

<div class="page">
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- EDIT DEALS SECTION                                      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="edit-deals-section">
    <div class="section-label">Edit Existing Deals</div>
    <div class="edit-deal-list" id="editDealList">
      <p style="color:var(--muted);font-size:14px;">Loading deals…</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ADD DEAL SECTION                                        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="add-deal-section">
    <div class="section-label">Add New Deal</div>
    <div class="deal-form">

      <!-- Row 1: Address (full width) -->
      <div style="margin-bottom:16px;">
        <div class="form-group full">
          <label>Property Address *</label>
          <input type="text" id="df-address" placeholder="e.g. 1234 Main St, Saint Louis, MO 63101" required />
        </div>
      </div>

      <!-- Row 2: Type + Source + Zip -->
      <div class="form-row-3" style="margin-bottom:16px;">
        <div class="form-group">
          <label>Property Type</label>
          <select id="df-type">
            <option value="Single Family">Single Family</option>
            <option value="Multi Family">Multi Family</option>
            <option value="Condo">Condo</option>
            <option value="Mobile">Mobile</option>
            <option value="Commercial">Commercial</option>
            <option value="Land">Land</option>
          </select>
        </div>
        <div class="form-group">
          <label>Source / Who Sent It</label>
          <input type="text" id="df-source" placeholder="e.g. New Western, Liah Avisar" />
        </div>
        <div class="form-group">
          <label>Zip Code</label>
          <input type="text" id="df-zip" placeholder="63101" maxlength="5" />
        </div>
      </div>

      <!-- Row 3: Beds / Baths / Sqft / Year -->
      <div class="form-row-4" style="margin-bottom:16px;">
        <div class="form-group">
          <label>Beds</label>
          <input type="number" id="df-beds" placeholder="3" min="0" step="1" />
        </div>
        <div class="form-group">
          <label>Baths</label>
          <input type="number" id="df-baths" placeholder="2" min="0" step="0.5" />
        </div>
        <div class="form-group">
          <label>Sq Ft</label>
          <input type="number" id="df-sqft" placeholder="1200" min="0" />
        </div>
        <div class="form-group">
          <label>Year Built</label>
          <input type="number" id="df-year" placeholder="1955" min="1800" max="2030" />
        </div>
      </div>

      <!-- Row 4: Prices -->
      <div class="form-row-3" style="margin-bottom:16px;">
        <div class="form-group">
          <label>Asking Price</label>
          <input type="number" id="df-price" placeholder="125000" min="0" />
          <div class="price-hint">Leave blank if unknown</div>
        </div>
        <div class="form-group">
          <label>ARV (After Repair Value)</label>
          <input type="number" id="df-arv" placeholder="220000" min="0" />
          <div class="price-hint">Leave blank if unknown</div>
        </div>
        <div class="form-group">
          <label>Estimated Repair Cost</label>
          <input type="number" id="df-repairs" placeholder="45000" min="0" />
          <div class="price-hint">Leave blank if unknown</div>
        </div>
      </div>

      <!-- Row 5: Drive folder + Date -->
      <div class="form-grid" style="margin-bottom:4px;">
        <div class="form-group">
          <label>Google Drive Photo Folder (optional)</label>
          <input type="text" id="df-drive" placeholder="https://drive.google.com/drive/folders/..." />
        </div>
        <div class="form-group">
          <label>Date Received</label>
          <input type="date" id="df-date" />
        </div>
      </div>

      <div class="form-actions">
        <button class="submit-deal-btn" id="submitDealBtn" onclick="submitDeal()">Add to Portal →</button>
        <span class="deal-form-status" id="dealFormStatus"></span>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-name" id="lightboxName"></div>
    <button class="lightbox-set-btn" id="lightboxSetBtn" onclick="setFromLightbox()">Set as Cover Photo</button>
  </div>
</div>

<div class="toast" id="toast"></div>

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleEditRow(id) {
  const row = document.getElementById('edit-row-' + id);
  if (!row) return;
  const wasOpen = row.classList.contains('open');
  row.classList.toggle('open');
  // Auto-load photos on first open if the deal has a Drive folder
  if (!wasOpen) {
    const deal = ALL_DEALS_DATA.find(d => (d.leadId || '') === String(id));
    if (deal && deal.driveUrl) {
      const grid = document.getElementById('ephoto-grid-' + id);
      if (grid && grid.dataset.loaded === '0') {
        grid.dataset.loaded = '1';
        loadEditPhotos(id, extractFolderId(deal.driveUrl));
      }
    }
  }
}

function extractFolderId(url) {
  if (!url) return null;
  const m = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

async function loadEditPhotos(leadId, folderId) {
  const grid = document.getElementById('ephoto-grid-' + leadId);
  if (!folderId || !grid) return;
  grid.innerHTML = '<p style="color:var(--muted);font-size:13px;grid-column:1/-1;">Loading photos from Drive…</p>';
  try {
    const res = await fetch(GAS_URL + '?action=getFolderPhotos&folderId=' + encodeURIComponent(folderId));
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Could not load photos');
    if (!data.photos || !data.photos.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:13px;grid-column:1/-1;">No photos found in this Drive folder.</p>';
      return;
    }
    const deal = ALL_DEALS_DATA.find(d => d.leadId === leadId);
    const currentPhotoUrl = deal ? (deal.photo || '') : '';
    grid.innerHTML = data.photos.map(photo => {
      const isCover = currentPhotoUrl && currentPhotoUrl.includes(photo.id);
      return `<div class="edit-photo-thumb${isCover ? ' is-cover' : ''}" id="ephoto-${photo.id}">
        <img src="${thumbUrl(photo.id, 'w300')}" alt="${photo.name}" loading="lazy" onerror="this.style.opacity=0.3">
        ${isCover ? '<div class="edit-photo-cover-badge">✓ Cover</div>' : ''}
        <div class="edit-photo-actions">
          <button class="ephoto-cover-btn" onclick="setEditCoverPhoto('${leadId}','${photo.id}',this)">Set Cover</button>
          <button class="ephoto-del-btn" onclick="deleteEditPhoto('${leadId}','${photo.id}',this)">Delete</button>
        </div>
      </div>`;
    }).join('');
  } catch(err) {
    grid.innerHTML = `<p style="color:var(--red);font-size:13px;grid-column:1/-1;">Error loading photos: ${err.message}</p>`;
  }
}

async function setEditCoverPhoto(leadId, fileId, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  const newPhotoUrl = `https://lh3.googleusercontent.com/d/${fileId}`;
  try {
    const deal = ALL_DEALS_DATA.find(d => d.leadId === leadId);
    if (!deal) throw new Error('Deal not found');
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'updateDeal', deal: Object.assign({}, deal, { photo: newPhotoUrl }) })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to set cover');
    deal.photo = newPhotoUrl;
    // Update UI — clear all cover marks, mark this one
    const grid = document.getElementById('ephoto-grid-' + leadId);
    if (grid) {
      grid.querySelectorAll('.edit-photo-thumb').forEach(el => {
        el.classList.remove('is-cover');
        const badge = el.querySelector('.edit-photo-cover-badge');
        if (badge) badge.remove();
      });
      const thisThumb = document.getElementById('ephoto-' + fileId);
      if (thisThumb) {
        thisThumb.classList.add('is-cover');
        thisThumb.insertAdjacentHTML('afterbegin', '<div class="edit-photo-cover-badge">✓ Cover</div>');
      }
    }
    showToast('Cover photo updated!');
  } catch(err) {
    showToast('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Set Cover';
  }
}

async function deleteEditPhoto(leadId, fileId, btn) {
  if (!confirm('Delete this photo from Drive? This cannot be undone.')) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'deletePhoto', fileId })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to delete');
    const thumb = document.getElementById('ephoto-' + fileId);
    if (thumb) thumb.remove();
    showToast('Photo deleted from Drive');
  } catch(err) {
    showToast('Error: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

async function saveDeal(leadId) {
  const btn = document.querySelector(`#edit-row-${leadId} .save-deal-btn`);
  const statusEl = document.getElementById('ef-status-msg-' + leadId);
  btn.disabled = true;
  statusEl.textContent = 'Saving…';
  statusEl.className = 'edit-status';

  const numOrNull = id => {
    const v = document.getElementById(id);
    return v && v.value !== '' ? parseFloat(v.value) : null;
  };
  const strVal = id => {
    const v = document.getElementById(id);
    return v ? v.value.trim() : '';
  };

  const deal = {
    leadId,
    address: strVal('ef-address-' + leadId),
    city: strVal('ef-city-' + leadId),
    state: strVal('ef-state-' + leadId).toUpperCase(),
    propertyType: strVal('ef-type-' + leadId),
    status: strVal('ef-status-' + leadId),
    beds: numOrNull('ef-beds-' + leadId),
    baths: numOrNull('ef-baths-' + leadId),
    sqft: numOrNull('ef-sqft-' + leadId),
    yearBuilt: numOrNull('ef-year-' + leadId) ? parseInt(numOrNull('ef-year-' + leadId)) : null,
    askingPrice: numOrNull('ef-price-' + leadId),
    arv: numOrNull('ef-arv-' + leadId),
    repairCost: numOrNull('ef-repairs-' + leadId),
    source: strVal('ef-source-' + leadId),
    driveUrl: strVal('ef-drive-' + leadId) || null,
    zip: strVal('ef-zip-' + leadId),
    notes: strVal('ef-notes-' + leadId) || null,
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'updateDeal', deal })
    });
    const data = await res.json();
    if (data.success) {
      statusEl.textContent = '✅ Saved!';
      statusEl.className = 'edit-status success';
      // Update the header summary
      const row = document.getElementById('edit-row-' + leadId);
      const street = deal.address.split(',')[0];
      const cityLine = [deal.city, deal.state].filter(Boolean).join(', ');
      const priceStr = deal.askingPrice ? '$' + Math.round(deal.askingPrice).toLocaleString() : '—';
      row.querySelector('.edit-deal-addr').textContent = street;
      row.querySelector('.edit-deal-meta').textContent = cityLine + ' · ' + priceStr + ' asking · ' + deal.status;
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(err) {
    statusEl.textContent = '⚠️ ' + err.message;
    statusEl.className = 'edit-status error';
  } finally {
    btn.disabled = false;
  }
}

async function deleteDeal(leadId, address) {
  if (!confirm(`Remove "${address}" from the portal?\n\nBuyers will no longer see this deal. You can restore it by changing its status back in the sheet.`)) return;
  const btn = document.querySelector(`#edit-row-${leadId} .delete-deal-btn`);
  const statusEl = document.getElementById('ef-status-msg-' + leadId);
  if (btn) { btn.disabled = true; btn.textContent = 'Removing…'; }
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'updateDeal', deal: { leadId, status: 'archived' } })
    });
    const data = await res.json();
    if (data.success) {
      const row = document.getElementById('edit-row-' + leadId);
      if (row) {
        row.style.transition = 'opacity .3s';
        row.style.opacity = '0';
        setTimeout(() => row.remove(), 320);
      }
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(err) {
    if (statusEl) { statusEl.textContent = '⚠️ ' + err.message; statusEl.className = 'edit-status error'; }
    if (btn) { btn.disabled = false; btn.textContent = '🗑 Delete Deal'; }
  }
}

function renderDealsWithPhotos() {
  const container = document.getElementById('dealsWithPhotos');
  if (!container) return; // section removed from HTML — skip silently

  // Merge hardcoded + live GAS folders + any user-added ones from localStorage
  const allFolders = Object.assign({}, PHOTO_FOLDERS, liveFolders, additionalFolders);

  const addresses = Object.keys(allFolders);
  if (!addresses.length) {
    container.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:20px 0;">No photo folders linked yet. Add one below.</p>';
    return;
  }

  container.innerHTML = '';
  addresses.forEach(address => {
    const folder = allFolders[address];
    const pending = pendingChanges[address];
    const isPending = !!pending;
    const shortAddress = shortAddr(address);

    const card = document.createElement('div');
    card.className = 'deal-card';
    card.dataset.address = address;

    // Determine current display photo for header
    const currentFileId = isPending ? pending.fileId : folder.currentPhotoFile;
    const coverThumbHtml = currentFileId
      ? `<img class="deal-cover-thumb" src="${thumbUrl(currentFileId, 'w200')}" alt="" onerror="this.style.display='none'">`
      : `<div class="deal-cover-thumb no-photo">📷</div>`;

    card.innerHTML = `
      <div class="deal-header" onclick="toggleCard(this)">
        ${coverThumbHtml}
        <div class="deal-info">
          <div class="deal-address">${shortAddress}${isPending ? '<span class="pending-tag">Pending Change</span>' : ''}</div>
          <div class="deal-meta">${folder.photos ? folder.photos.length + '+' : '?'} photos available &nbsp;·&nbsp; ${address.split(',').slice(1).join(',').trim()}</div>
        </div>
        <div class="expand-icon">▾</div>
      </div>
      <div class="photo-panel">
        <div class="photo-panel-header">
          <span class="photo-count">${folder.photos ? folder.photos.length : 0} photos loaded</span>
          ${folder.folderId ? `<a class="folder-link" href="https://drive.google.com/drive/folders/${folder.folderId}" target="_blank">Open in Drive ↗</a>` : ''}
          ${isPending ? `<button onclick="clearPending('${address}')" style="margin-left:auto;font-size:11px;color:var(--red);background:none;border:1px solid var(--red);border-radius:4px;padding:3px 10px;cursor:pointer;">Clear Pending</button>` : ''}
        </div>
        <div class="photo-grid" id="grid-${address.replace(/[^a-z0-9]/gi,'_')}">
          ${renderPhotoGrid(address, folder)}
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  populateAddFolderSelect();
}

function renderPhotoGrid(address, folder) {
  if (!folder.photos || !folder.photos.length) return '<p style="color:var(--muted);font-size:13px;">No photos listed.</p>';

  const currentFileId = folder.currentPhotoFile;
  const pendingFileId = pendingChanges[address] ? pendingChanges[address].fileId : null;

  return folder.photos.map(photo => {
    const isCurrent = photo.id === currentFileId;
    const isPendingSelected = photo.id === pendingFileId;
    const cls = `photo-thumb${isCurrent ? ' current' : ''}${isPendingSelected ? ' selected' : ''}`;
    const badge = isCurrent
      ? '<span class="badge badge-current">✓ Current</span>'
      : isPendingSelected
        ? '<span class="badge badge-selected">★ Selected</span>'
        : '';

    return `<div class="${cls}" onclick="selectPhoto('${address}','${photo.id}','${photo.name}')" ondblclick="openLightbox('${address}','${photo.id}','${photo.name}',event)">
      <img src="${thumbUrl(photo.id, 'w300')}" alt="${photo.name}" loading="lazy" onerror="this.style.opacity=0.3">
      ${badge}
      <div class="thumb-label">${photo.name}</div>
    </div>`;
  }).join('');
}

async function toggleCard(header) {
  const card = header.closest('.deal-card');
  const wasOpen = card.classList.contains('open');
  card.classList.toggle('open');

  // When opening, load photos from Drive if not yet populated
  if (!wasOpen) {
    const address = card.dataset.address;
    const allFolders = Object.assign({}, PHOTO_FOLDERS, liveFolders, additionalFolders);
    const folder = allFolders[address];
    if (folder && (!folder.photos || !folder.photos.length) && folder.folderId) {
      const gridId = 'grid-' + address.replace(/[^a-z0-9]/gi, '_');
      const grid = document.getElementById(gridId);
      if (grid) {
        grid.innerHTML = '<p style="color:var(--muted);font-size:13px;">Loading photos from Drive…</p>';
        try {
          const res = await fetch(GAS_URL + '?action=getFolderPhotos&folderId=' + encodeURIComponent(folder.folderId));
          const data = await res.json();
          if (data.success && data.photos && data.photos.length) {
            folder.photos = data.photos;
            // Update the current cover photo marker if we know it
            const deal = ALL_DEALS_DATA.find(d => d.address === address);
            if (deal && deal.photo) {
              const matchedPhoto = data.photos.find(p => deal.photo.includes(p.id));
              if (matchedPhoto) folder.currentPhotoFile = matchedPhoto.id;
            }
            const countEl = card.querySelector('.photo-count');
            if (countEl) countEl.textContent = data.photos.length + ' photos loaded';
            grid.innerHTML = renderPhotoGrid(address, folder);
          } else {
            grid.innerHTML = '<p style="color:var(--muted);font-size:13px;">No photos found in this folder.</p>';
          }
        } catch(e) {
          grid.innerHTML = '<p style="color:var(--red);font-size:13px;">Error loading photos from Drive.</p>';
        }
      }
    }
  }
}

// ============================================================
// PHOTO SELECTION
// ============================================================
function selectPhoto(address, fileId, filename) {
  // Update pending changes
  pendingChanges[address] = { fileId, filename, timestamp: new Date().toISOString() };
  localStorage.setItem('photoChanges', JSON.stringify(pendingChanges));

  // Re-render just this grid
  const allFolders = Object.assign({}, PHOTO_FOLDERS, liveFolders, additionalFolders);
  const folder = allFolders[address];
  const gridId = 'grid-' + address.replace(/[^a-z0-9]/gi,'_');
  document.getElementById(gridId).innerHTML = renderPhotoGrid(address, folder);

  // Update the cover thumb in header
  const card = document.querySelector(`[data-address="${address}"]`);
  if (card) {
    const thumb = card.querySelector('.deal-cover-thumb');
    if (thumb) {
      thumb.src = thumbUrl(fileId, 'w200');
      thumb.style.display = '';
      thumb.className = 'deal-cover-thumb';
    }
    // Add pending tag if not already there
    const addrEl = card.querySelector('.deal-address');
    if (!addrEl.querySelector('.pending-tag')) {
      addrEl.insertAdjacentHTML('beforeend', '<span class="pending-tag">Pending Change</span>');
    }
    // Add clear button to photo panel header if not there
    const panelHeader = card.querySelector('.photo-panel-header');
    if (!panelHeader.querySelector('.clear-pending-btn')) {
      panelHeader.insertAdjacentHTML('beforeend', `<button class="clear-pending-btn" onclick="clearPending('${address}')" style="margin-left:auto;font-size:11px;color:var(--red);background:none;border:1px solid var(--red);border-radius:4px;padding:3px 10px;cursor:pointer;">Clear Pending</button>`);
    }
  }

  updatePendingBar();
  showToast(`${filename} selected as cover photo`);
}

function clearPending(address) {
  delete pendingChanges[address];
  localStorage.setItem('photoChanges', JSON.stringify(pendingChanges));
  renderDealsWithPhotos();
  updatePendingBar();
  showToast('Selection cleared');
}

function updatePendingBar() {
  // Legacy Cover Photo Manager queue UI (pendingBar/applyAllBtn/copyArea) was
  // removed from the page; this is now a no-op guarded against null elements
  // in case stale localStorage from an old session still has photoChanges set.
  const bar = document.getElementById('pendingBar');
  const badge = document.getElementById('pendingCount');
  const btn = document.getElementById('applyAllBtn');
  if (!bar || !badge || !btn) return;
  const count = Object.keys(pendingChanges).length;
  if (count > 0) {
    bar.classList.add('visible');
    btn.classList.add('visible');
    badge.textContent = count + (count === 1 ? ' pending change' : ' pending changes');
  } else {
    bar.classList.remove('visible');
    btn.classList.remove('visible');
    const copyAreaEl = document.getElementById('copyArea');
    if (copyAreaEl) copyAreaEl.style.display = 'none';
  }
}

// ============================================================
// LIGHTBOX
// ============================================================
function openLightbox(address, fileId, name, e) {
  e.stopPropagation();
  lightboxCurrent = { address, fileId, name };
  document.getElementById('lightboxImg').src = thumbUrl(fileId, 'w1000');
  document.getElementById('lightboxName').textContent = name;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  lightboxCurrent = null;
}

function setFromLightbox() {
  if (lightboxCurrent) {
    selectPhoto(lightboxCurrent.address, lightboxCurrent.fileId, lightboxCurrent.name);
    closeLightbox();
  }
}

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

// ============================================================
// AUTO-SUBMIT TO GOOGLE APPS SCRIPT
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxATueK1LD5LFGL_KNCBXF6ijTeFyE5qcYsSFdcPucbsNQSD8SeDnBGT3O8ZBafqy2F7Q/exec';

// Fetch live deal list from GAS to keep the folder-link dropdown current
fetch(GAS_URL + '?action=getDeals')
  .then(r => r.json())
  .then(data => {
    ALL_DEAL_ADDRESSES = (Array.isArray(data) ? data : (data.deals || [])).map(d => d.address).filter(Boolean);
    populateAddFolderSelect();
  })
  .catch(() => {});

async function applyChanges() {
  if (!Object.keys(pendingChanges).length) return;

  const changes = Object.entries(pendingChanges).map(([address, change]) => ({
    address,
    fileId: change.fileId,
    filename: change.filename || ''
  }));

  const copyArea = document.getElementById('copyArea');
  const titleEl = document.getElementById('copyAreaTitle');
  const msgEl = document.getElementById('copyAreaMsg');

  titleEl.textContent = 'Submitting changes…';
  msgEl.textContent = `Sending ${changes.length} photo selection(s) to the queue…`;
  copyArea.style.display = 'block';
  copyArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ changes })
    });
    const data = await res.json();
    if (data.success) {
      titleEl.textContent = '✅ Changes queued!';
      msgEl.textContent = `${data.queued} photo change(s) added to the queue. The portal will update automatically within the hour.`;
      showToast('Changes submitted — portal will update shortly!');
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(err) {
    titleEl.textContent = '⚠️ Submission failed';
    msgEl.innerHTML = `Could not reach the queue server: ${err.message}<br><br>
      <strong>Manual fallback:</strong> The changes are still saved locally. Here's what to apply:<br><br>` +
      changes.map(c => `• "${c.address}": fileId="${c.fileId}"`).join('<br>');
  }
}

// ============================================================
// ADD FOLDER
// ============================================================
function populateAddFolderSelect() {
  const sel = document.getElementById('addFolderDeal');
  const allFolders = Object.assign({}, PHOTO_FOLDERS, liveFolders, additionalFolders);
  sel.innerHTML = '<option value="">Select deal...</option>';
  ALL_DEAL_ADDRESSES.forEach(addr => {
    if (!allFolders[addr]) {
      const opt = document.createElement('option');
      opt.value = addr;
      opt.textContent = shortAddr(addr) + ' · ' + addr.split(',').slice(1).join(',').trim();
      sel.appendChild(opt);
    }
  });
}

function requestAddFolder() {
  const deal = document.getElementById('addFolderDeal').value;
  const url = document.getElementById('addFolderUrl').value.trim();
  if (!deal || !url) { showToast('Please select a deal and enter a folder URL'); return; }

  const match = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  if (!match) { showToast('Invalid Drive folder URL'); return; }
  const folderId = match[1];

  // Store in localStorage as a request
  const folderRequests = JSON.parse(localStorage.getItem('folderRequests') || '{}');
  folderRequests[deal] = { folderId, url, requestedAt: new Date().toISOString() };
  localStorage.setItem('folderRequests', JSON.stringify(folderRequests));

  // Generate request text
  const requestText = `Add Drive folder to portal for deal:\n- Address: "${deal}"\n- Drive Folder ID: ${folderId}\n- Folder URL: ${url}\n\nPlease list the photos in this folder and add them to the admin page.`;
  document.getElementById('copyText').value = requestText;
  document.getElementById('copyArea').style.display = 'block';
  document.getElementById('copyArea').scrollIntoView({ behavior: 'smooth' });
  showToast('Folder request ready — copy to Claude chat');
  document.getElementById('addFolderUrl').value = '';
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ============================================================
// ADD DEAL FORM
// ============================================================
(function setDefaultDate() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  document.getElementById('df-date').value = `${yyyy}-${mm}-${dd}`;
})();

function parseAddressParts(fullAddress) {
  // Try to extract city and state from "Street, City, State Zip"
  const parts = fullAddress.split(',').map(s => s.trim());
  if (parts.length >= 3) {
    const city = parts[1];
    const stateZip = parts[2].trim().split(' ');
    const state = stateZip[0];
    return { city, state };
  }
  return { city: '', state: '' };
}

async function submitDeal() {
  const address = document.getElementById('df-address').value.trim();
  if (!address) {
    showFormStatus('Please enter a property address.', 'error');
    return;
  }

  const btn = document.getElementById('submitDealBtn');
  btn.disabled = true;
  showFormStatus('Submitting…', '');

  const { city, state } = parseAddressParts(address);
  const driveRaw = document.getElementById('df-drive').value.trim();
  const driveUrl = driveRaw || null;

  const deal = {
    address,
    city,
    state,
    date: document.getElementById('df-date').value,
    propertyType: document.getElementById('df-type').value,
    source: document.getElementById('df-source').value.trim(),
    beds: document.getElementById('df-beds').value ? parseFloat(document.getElementById('df-beds').value) : null,
    baths: document.getElementById('df-baths').value ? parseFloat(document.getElementById('df-baths').value) : null,
    sqft: document.getElementById('df-sqft').value ? parseFloat(document.getElementById('df-sqft').value) : null,
    yearBuilt: document.getElementById('df-year').value ? parseInt(document.getElementById('df-year').value) : null,
    askingPrice: document.getElementById('df-price').value ? parseFloat(document.getElementById('df-price').value) : null,
    arv: document.getElementById('df-arv').value ? parseFloat(document.getElementById('df-arv').value) : null,
    repairCost: document.getElementById('df-repairs').value ? parseFloat(document.getElementById('df-repairs').value) : null,
    driveUrl,
    zip: document.getElementById('df-zip').value.trim(),
    status: 'new',
    photo: '',
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'addDeal', deal })
    });
    const data = await res.json();
    if (data.success) {
      showFormStatus('✅ Deal added! Refresh the portal to see it live.', 'success');
      showToast('Deal added to the portal queue!');
      // Add to local list and refresh folder dropdown
      if (!ALL_DEAL_ADDRESSES.includes(address)) {
        ALL_DEAL_ADDRESSES.push(address);
        populateAddFolderSelect();
      }
      // Clear the form
      ['df-address','df-source','df-zip','df-beds','df-baths','df-sqft','df-year','df-price','df-arv','df-repairs','df-drive'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('df-type').value = 'Single Family';
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(err) {
    showFormStatus('⚠️ Submission failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function showFormStatus(msg, type) {
  const el = document.getElementById('dealFormStatus');
  el.textContent = msg;
  el.className = 'deal-form-status' + (type ? ' ' + type : '');
}

// ============================================================
// INIT
// ============================================================
try { renderDealsWithPhotos(); } catch(e) { console.warn('renderDealsWithPhotos failed:', e); }
try { updatePendingBar(); } catch(e) { console.warn('updatePendingBar failed:', e); }

// Load all deals for editing AND to populate Cover Photo Manager
// Runs independently so any earlier error can't block this
fetch(GAS_URL + '?action=getDeals')
  .then(r => r.json())
  .then(data => {
    ALL_DEALS_DATA = Array.isArray(data) ? data : (data.deals || []);
    // Normalize: GAS may return 'Notes' (capital N) — map to lowercase 'notes'
    // so the edit form actually shows notes that are already live on the portal.
    ALL_DEALS_DATA = ALL_DEALS_DATA.map(d => { if (!d.notes && d.Notes) d.notes = d.Notes; return d; });
    renderEditDeals(ALL_DEALS_DATA);

    // Build liveFolders from any deal that has a driveUrl but isn't already
    // hardcoded in PHOTO_FOLDERS, then re-render the Cover Photo Manager
    liveFolders = {};
    ALL_DEALS_DATA.forEach(d => {
      if (d.driveUrl && d.status !== 'archived' && !PHOTO_FOLDERS[d.address]) {
        const fid = extractFolderId(d.driveUrl);
        if (fid) liveFolders[d.address] = { folderId: fid, currentPhotoFile: null, photos: [] };
      }
    });
    try { renderDealsWithPhotos(); } catch(e) { console.warn('renderDealsWithPhotos (post-fetch) failed:', e); }
  })
  .catch(err => {
    console.error('Failed to load deals from GAS:', err);
    document.getElementById('editDealList').innerHTML = '<p style="color:var(--muted)">Failed to load deals. Check your connection and refresh.</p>';
  });

// Auto-expand deal if URL has a hash (coming from portal's change-photo button)
(function() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (!hash) return;
  // Find the card matching the address
  const cards = document.querySelectorAll('.deal-card');
  cards.forEach(card => {
    if (card.dataset.address === hash) {
      // Expand if not already open
      if (!card.classList.contains('open')) card.classList.add('open');
      setTimeout(() => {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        card.style.outline = '2px solid var(--salmon)';
        setTimeout(() => card.style.outline = '', 2000);
      }, 200);
    }
  });
})();
</script>
